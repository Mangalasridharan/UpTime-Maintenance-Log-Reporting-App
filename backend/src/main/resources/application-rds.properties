# =============================================================================
#  Amazon RDS profile
#  Activated when DB_PROFILE=rds is set in .env
# =============================================================================
# Required environment variables:
#   DB_HOST       -> RDS endpoint, e.g. <db-instance>.<region>.rds.amazonaws.com
#   DB_USER       -> RDS database username
#   DB_PASSWORD   -> RDS database password
#   DB_NAME       -> RDS database name
# Optional: SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
#            to override the connection entirely.
# If your RDS instance enforces SSL, append ?sslmode=require to the URL below
# (or set SPRING_DATASOURCE_URL with it).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}