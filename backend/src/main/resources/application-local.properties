# =============================================================================
#  Local PostgreSQL profile (default)
#  Activated automatically when DB_PROFILE is unset or set to "local".
# =============================================================================
# Every setting below can be overridden by SPRING_DATASOURCE_URL,
# SPRING_DATASOURCE_USERNAME and SPRING_DATASOURCE_PASSWORD (e.g. Docker Compose,
# GitHub Actions, or when a full connection string is preferred).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:Uptime-Maintenance-log-reporting-app}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:postgres}}