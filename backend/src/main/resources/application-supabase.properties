# =============================================================================
#  Supabase profile
#  Activated when DB_PROFILE=supabase is set in .env
# =============================================================================
# Required environment variables:
#   DB_HOST       -> Supabase host, e.g. db.<project-ref>.supabase.co
#   DB_USER       -> e.g. postgres or postgres.<project-ref>
#   DB_PASSWORD   -> Supabase database password
#   DB_NAME       -> database name (Supabase default: postgres)
# Optional: SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
#            to override the connection entirely.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:postgres}?sslmode=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}