spring.config.import=optional:file:.env[.properties]

spring.application.name=backend

server.port = ${PORT:8000}

# Database configuration (supports Supabase, AWS RDS, Docker, and local PostgreSQL)
spring.datasource.url = ${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:Uptime-Maintenance-log-reporting-app}}}
spring.datasource.username = ${SPRING_DATASOURCE_USERNAME:${DB_USER:postgres}}
spring.datasource.password = ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:mangal@123}}

spring.jpa.hibernate.ddl-auto = update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.security.employee.name = ${ADMIN_EMPLOYEE_NAME:mangal}
spring.security.employee.password = ${ADMIN_EMPLOYEE_PASSWORD:mangal@123}
jwt.secret = ${JWT_SECRET:VGhpc0lzQVN1cGVyU2VjcmV0S2V5Rm9ySldUU3ByaW5nQm9vdA==}
jwt.expiration_time = ${JWT_EXPIRATION:1800000}
