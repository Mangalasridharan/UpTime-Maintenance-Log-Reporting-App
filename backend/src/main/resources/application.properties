spring.config.import=optional:file:.env[.properties]

spring.application.name=backend

# ---------- Database source selection ----------
# Set DB_PROFILE in .env to switch the database source:
#   local     -> local PostgreSQL (also used by Docker Compose / CI)
#   supabase  -> Supabase hosted PostgreSQL
#   rds       -> Amazon RDS PostgreSQL
spring.profiles.active=${DB_PROFILE:local}

server.port = ${PORT:8000}

# ---------- JPA (shared by all database profiles) ----------
spring.jpa.hibernate.ddl-auto = update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ---------- Security / JWT ----------
spring.security.employee.name = ${ADMIN_EMPLOYEE_NAME:mangal}
spring.security.employee.password = ${ADMIN_EMPLOYEE_PASSWORD:mangal@123}
jwt.secret = ${JWT_SECRET:VGhpc0lzQVN1cGVyU2VjcmV0S2V5Rm9ySldUU3ByaW5nQm9vdA==}
jwt.expiration_time = ${JWT_EXPIRATION:1800000}

# ---------- RabbitMQ messaging ----------
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.listener.simple.acknowledge-mode=auto
spring.rabbitmq.listener.simple.prefetch=1

# ---------- File uploads for daily machine logs ----------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ---------- OpenAPI / Swagger UI ----------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true
springdoc.default-produces-media-type=application/json
springdoc.default-consumes-media-type=application/json