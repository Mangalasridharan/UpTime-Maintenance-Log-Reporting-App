services:
  postgres:
    image: postgres:16-alpine
    container_name: uptime-postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-Uptime-Maintenance-log-reporting-app}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mangal@123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-Uptime-Maintenance-log-reporting-app}"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: uptime-rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: uptime-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      PORT: 8000
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-Uptime-Maintenance-log-reporting-app}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-mangal@123}
      JWT_SECRET: ${JWT_SECRET:-VGhpc0lzQVN1cGVyU2VjcmV0S2V5Rm9ySldUU3ByaW5nQm9vdA==}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-1800000}
      ADMIN_EMPLOYEE_NAME: ${ADMIN_EMPLOYEE_NAME:-mangal}
      ADMIN_EMPLOYEE_PASSWORD: ${ADMIN_EMPLOYEE_PASSWORD:-mangal@123}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-guest}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASS:-guest}
    ports:
      - "8000:8000"

volumes:
  postgres_data:
  rabbitmq_data:
